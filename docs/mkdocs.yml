site_name: PeekSeek Docs
site_description: Run PeekSeek yourself, or fork it for another game
repo_url: https://github.com/PeekSeek/PeekSeek
repo_name: PeekSeek/PeekSeek

theme:
  name: material
  palette:
    scheme: slate
    primary: red
    accent: red
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - stylesheets/peekseek.css

markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - attr_list
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - How it works:
    - Architecture: architecture.md
    - The match lifecycle: match-lifecycle.md
  - Running your own:
    - Self-hosting: self-hosting.md
    - Configuration: configuration.md
  - Forking:
    - Another game: forking.md
