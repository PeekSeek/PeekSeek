name: Idea
description: Something that should exist
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is the problem
      description: Start with the thing that is annoying, not the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you would do about it

  - type: textarea
    id: alternatives
    attributes:
      label: What else you considered
      description: Including doing nothing. Plenty of good ideas lose to that one.
