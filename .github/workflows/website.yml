name: website

on:
  push:
    branches: [main, develop]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  schedule:
    - cron: "0 6 * * 1" # weekly, for the audit job
  workflow_dispatch: # path filters mean a shared change may not trigger this on its own

defaults:
  run:
    working-directory: website

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install black
      - run: black --check .

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The tests pin DB to in-memory SQLite in conftest and stub the rest, so no secrets here.
      - run: pip install -r requirements.txt pytest
      - run: pytest -v

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
