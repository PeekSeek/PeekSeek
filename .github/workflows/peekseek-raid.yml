name: peekseek-raid

on:
  push:
    branches: [main, develop]
    paths: ["plugins/peekseek-raid/**", "plugins/peekseek-match/plugin/**", ".github/workflows/peekseek-raid.yml"]
  pull_request:
    branches: [main]
    paths: ["plugins/peekseek-raid/**", "plugins/peekseek-match/plugin/**", ".github/workflows/peekseek-raid.yml"]
  workflow_dispatch: # path filters mean a shared change may not trigger this on its own

permissions:
  contents: write

# One run per branch. Successive pushes supersede each other for lint and test, where
# the older answer is about code nobody is looking at any more. The release job is
# guarded by its own tag-exists check, so a cancelled run cannot leave a half-cut tag.
concurrency:
  group: peekseek-raid-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plugins/peekseek-raid

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet format PeekSeekRaid.sln --verify-no-changes

  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - run: dotnet test PeekSeekRaid.sln --configuration Release

  release:
    # Releases are cut from main only. develop runs the same lint and tests,
    # but a staging push must never tag or publish.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      # Tags are prefixed because this repo releases more than one plugin.
      - name: Read version from PeekSeekRaid.csproj
        id: version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content plugin/PeekSeekRaid.csproj
          $version = $csproj.Project.PropertyGroup.Version
          "version=$version"                >> $env:GITHUB_OUTPUT
          "tag=peekseek-raid-v$version"    >> $env:GITHUB_OUTPUT

      # A release only happens when the version was actually bumped, so pushing
      # again without touching it is a no-op rather than a failed duplicate tag.
      - name: Check if tag already exists
        id: check
        shell: bash
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build
        if: steps.check.outputs.exists == 'false'
        run: dotnet build PeekSeekRaid.sln --configuration Release

      - name: Package artifact
        if: steps.check.outputs.exists == 'false'
        shell: pwsh
        run: |
          $out = "PeekSeekRaid-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path plugin/bin/Release/net48/* -DestinationPath $out
          "artifact=plugins/peekseek-raid/$out" >> $env:GITHUB_ENV

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        # Pinned to a commit, not the v2 tag: this is the one action here with
        # write scope, and a tag can be moved under us.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ env.artifact }}
