name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "website/API.md", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/**", "website/API.md", ".github/workflows/docs.yml"]
  workflow_dispatch: # path filters mean a shared change may not trigger this on its own

# One run per branch. Successive pushes supersede each other for lint and test, where
# the older answer is about code nobody is looking at any more. The release job is
# guarded by its own tag-exists check, so a cancelled run cannot leave a half-cut tag.
permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The site renders its API reference from the app's own OpenAPI schema, so the
      # docs build needs the website's dependencies to generate it.
      - run: pip install -r website/requirements.txt
      - run: npm ci
        working-directory: docs
      - run: npm run schema
        working-directory: docs
        env:
          DB: sqlite:// # Settings requires it; nothing connects.

      # starlight-links-validator fails the build on a broken internal link, which is
      # the only docs error worth blocking a merge for. This is a check, not a deploy:
      # the built site ships inside the website image (see website/Dockerfile) and goes
      # out with the next deploy of the site, not from here.
      - run: npm run build
        working-directory: docs
