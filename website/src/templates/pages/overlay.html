<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    
    <meta charset="utf-8">
    <title>PeekSeek Overlay</title>

    <meta http-equiv="Content-Security-Policy" content="script-src * 'unsafe-inline' 'unsafe-eval';">

    <script type="text/javascript">
      let matchid = {{matchid | safe}};
      let createdby = {{createdBy | safe}};
    </script>

    <script src="/static/assets/api.js" crossorigin="anonymous" defer></script>
    <script src="/static/assets/overlayUpdated.js" crossorigin="anonymous" defer></script>

    <link rel="stylesheet" href="/static/assets/overlay.css" crossorigin="anonymous"></link>
  </head>
  <body>
    <!-- What fills the gap before the first round. Two faces, swapped by class on
         #notStarted: "waiting" while there is no match to describe yet, and
         "intermission" once there is a roster to read. Both are built here rather than
         by script so the markup can be styled and checked without a live match. -->
    <div id="notStarted" class="waiting">
      <div class="splash">
        <img src="/static/img/cmw.png" style="height:10vh;">
        <h1>Starting soon</h1>
        <span id="notStartedText">Loading teams…</span>
      </div>

      <div class="intermission">
        <div class="notch flat">
          <svg class="flare l" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 0 L10 0 L10 10 A10 10 0 0 0 0 0 Z"/></svg>
          <span class="tn" id="imLeftName"></span>
          <span class="mid" id="imClock"></span>
          <span class="tn" id="imRightName"></span>
          <svg class="flare r" viewBox="0 0 10 10" aria-hidden="true"><path d="M10 0 L0 0 L0 10 A10 10 0 0 1 10 0 Z"/></svg>
        </div>

        <div class="imcaption">
          <span class="mode" id="imMode"></span>
          <span class="rules" id="imRules"></span>
        </div>

        <div class="rosters">
          <div class="col l" id="imLeft"></div>
          <span class="vs">VS</span>
          <div class="col r" id="imRight"></div>
        </div>
      </div>
    </div>

    <div id="hud"></div>
</body>
</html>
