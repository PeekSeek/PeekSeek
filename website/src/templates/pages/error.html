<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{error}}</title>
    <meta property="og:title" content="{{message}}">
    <meta property="og:description" content="Something went wrong.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{config.base_url}}">
    <meta property="og:image" content="{{config.base_url}}/static/img/cmw.png">

    <link rel="icon" href="/static/img/logo-dark.ico">
    <link rel="icon" href="/static/img/logo.ico" media="(prefers-color-scheme:dark)">

    <style>
        * {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            
            background-color: rgb(143, 0, 0);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        h1 {
            font-size: 10rem;
            margin: 0;
        }
        p {
            font-size: 1.5rem;
        }
        a {
            color: white;
            text-decoration: underline;
        }
        a:hover {
            text-decoration: none;
        }
        button {
            background-color: white;
            color: red;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            transform: scale(1.05);
            font-size: calc(1rem / 1.05);
            transition: transform 0.3s ease, background-color 0.3s ease;
        }

        div, span {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3rem;
        }

        span {
            gap: 1rem;
        }
    </style>
</head>
<body>
    <div>
        <h1>{{error}}</h1>
        <span>
            <p>{{message}}</p>
            {% if not noHomeButton %}
                <a href="/"><button>Return home</button></a>
            {% endif %}
        </span>
    </div>
</body>
</html>
