# Non-secret configuration. Secrets (DB, tokens, keys) live in the environment.

[app]
domain = "127.0.0.1"        # public hostname, no scheme
protocol = "http"
build = "develop"

[matchmaking]
queue_timeout = 60   # seconds without a heartbeat before a player drops from queue
host_grace = 20      # seconds past selection a serverless match waits before it is cancelled
party_timeout = 600  # seconds with nobody looking at a party before it disbands
max_team_elo_gap = 400   # widest average-skill gap allowed between the teams in one match
rematch_cooldown = 300   # seconds before the same two players can be put against each other again
match_cooldown = 5       # seconds the site waits after making a match before it makes another, anywhere

[ranking]
# Two numbers per player. Skill is the hidden estimate matchmaking balances on: moved by
# wins and losses only, zero-sum within a match, never touched by a season. The ladder is
# the Elo players see and grind, and it is pulled towards skill rather than being it.
#
# The ladder: a win is worth `win_points` and a loss costs `loss_points`, a draw nothing.
# Sitting below your skill makes a win worth up to (1 + max_boost) times as much and a
# loss cost as little as (1 - max_relief) of it, growing smoothly with the gap until it
# is `converge_scale` wide. At or above skill it is plain +/- points, so the ladder of a
# player winning half their games stays where it is.
win_points = 20
loss_points = 20
converge_scale = 200
max_boost = 1.5
max_relief = 0.75
# Skill deviation, in Elo points: how unsure the site is of a player's skill. A higher
# one moves skill further per match, and every match played shrinks it.
new_deviation = 350    # an account with no standing at all
seed_deviation = 200   # a standing that predates skill, seeded from its Elo
min_deviation = 60     # the least unsure a veteran ever gets, so skill can still follow them
deviation_drift = 15   # added back before every match, the way Glicko-2's volatility is

[ranks]
# The badge a player's Elo earns them. `elo` is where a tier starts and it runs until
# the next tier's does, so the list has to stay sorted by it; test_ranks asserts that.
# `icon` names a file in public/ranks, and `role` the Discord role it grants. A tier-1
# badge shares its base tier's role: the ladder shows Immune 1, Discord shows Immune.
#
# The ladder starts at 100 because _ladderDelta refuses to take anybody below it, and a
# new account is seeded at 300, so Silver is where everyone begins and Bronze is
# somewhere you fall to rather than somewhere you start.
tiers = [
    { name = "Bronze",   elo = 100, icon = "bronze", role = "1546224903437688922" },
    { name = "Bronze 1", elo = 200, icon = "bronze1", role = "1546224903437688922" },
    { name = "Silver",   elo = 300, icon = "silver", role = "1546224908302942301" },
    { name = "Silver 1", elo = 400, icon = "silver1", role = "1546224908302942301" },
    { name = "Gold",     elo = 500, icon = "gold", role = "1546224913784901733" },
    { name = "Gold 1",   elo = 600, icon = "gold1", role = "1546224913784901733" },
    { name = "Immune",   elo = 700, icon = "immune", role = "1400869409517473922" },
    { name = "Immune 1", elo = 800, icon = "immune1", role = "1400869409517473922" },
    # `places` is what makes Apollo scarce, and it shares Immune 1's floor on purpose:
    # 800 Elo is the whole ladder's ceiling, and what separates the two badges above it
    # is a seat rather than a number. A player sitting sixth on 950 wears Immune 1 and
    # the way up is passing a person.
    # Only the top tier may carry this: Rank.forElo stops at a capped tier it cannot
    # award rather than looking past it, so a capped tier in the middle would hide
    # every tier above it.
    { name = "Apollo",   elo = 800, icon = "apollo", role = "1546224919094886451", places = 5 },
]

[lobby]
# The DeathMatch server's Steam server code, which is what /lobby hands to Unturned.
#
# This is the steamID64 the server's GSLT owns, so it survives a restart. The FakeIP
# address printed beside it in the console does not: the server runs with PROTECTION
# set to fakeip, and the relay hands out a fresh 169.254.x.x:port every session, which
# is exactly why the code and not the address is the thing worth writing down.
#
# It only changes if the login token does. Read the new one off the server console
# ("Server Code: ...") after a GSLT change.
connect_code = "85568392936415589"

[data_files]
# Big machine-shaped datasets stay JSON; these paths are relative to this file.
mmconfig = "mmconfig.json"
kits = "kits.json"

[permissions]
# Bit order matters — a permission's index is its bit in Users.permissions. Append only:
# reordering this list silently rewrites what every existing account is allowed to do.
list = ["admin", "canWriteBlog", "premium", "season_manager"]

[season]
# What a new season keeps of the last one. Applied once per player, on their first
# ranked match after the season opens -- the "refresher" -- so the carry-over lands with
# a result on it rather than silently overnight.
#
# A season is a soft reset: you come back near where you were, never above the cap, and
# always at least `drop` below where you finished.
carry_cap = 600     # Gold 1's floor. The top of the ladder is re-earned every season.
carry_drop = 150    # What a season always takes off, so nobody opens where they closed.
carry_floor = 300   # The seed a new account gets. Nobody starts a season under it, and
                    # anybody who finished under it is brought back up to it.
carry_keep = 50     # Finishing clear of that seed is worth something: a season takes the
                    # rest of the clearance but never the last of it, so a player who was
                    # ahead still opens ahead. Only applies above floor + keep.

[discord]
# The server rank roles are handed out in.
guild = "1309223629271339068"
client_id = "1317158396629094451"
invite_url = "https://discord.gg/NKgTe6RnvH"

# Voice channel renamed to the live arena population, so the sidebar answers "is
# anyone playing" without anyone having to open a channel or the game.
#
# A channel id is not a secret, so it lives here rather than in the environment.
# Nothing renames it unless BOT_TOKEN is set, which is what keeps dev — which
# deliberately runs without one — from renaming the production channel.
counter_channel = "1538266851203879032"

# Seconds between renames. Discord allows two channel renames per ten minutes and
# answers the third with a 429, so this cannot usefully go below ~300.
counter_interval = 360

# How long an arena must have been empty before the first player to walk into it is
# worth announcing. People join an empty server, find nobody, and leave within seconds,
# so a short value here would post several times an hour and teach everyone to ignore it.
wake_ping_after = 1800

# Where in-game /report lands, and the role it pings. Not secrets, so they live
# here rather than in the environment, and like counter_channel nothing posts
# unless BOT_TOKEN is set, which is what keeps dev out of the real staff channel.
#
# The ping goes in the message content, never in the embed: a mention inside an
# embed renders as a mention but notifies nobody, so a report that pinged no one
# would look identical to one that worked.
report_channel = "1543350716683395199"
staff_role = "1309223753129005117"

# Lifting a ban is logged apart from where reports land, because it is a different
# audience: a report is work waiting to be picked up, an overturn is a decision that
# has already been made and that the rest of staff should see.
overturn_channel = "1392874678577533039"

# Where the "how to report a cheater" notice sits, kept at the bottom of the channel.
# Not the report channel: this is aimed at players about to describe something they
# saw, and that is a different room from the one staff pick work up in.
sticky_channel = "1395115837551022162"

[regions.names]
# Region id -> display name used in Discord queue pings.
paris = "EU-West"
utah = "US-West"
singapore = "AS-South"
brazil = "SA-East"