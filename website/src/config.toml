# Non-secret configuration. Secrets (DB, tokens, keys) live in the environment.

[app]
domain = "127.0.0.1"        # public hostname, no scheme
protocol = "http"
build = "develop"

[matchmaking]
queue_timeout = 60   # seconds without a heartbeat before a player drops from queue
host_grace = 20      # seconds past selection a serverless match waits before it is cancelled
party_timeout = 600  # seconds with nobody looking at a party before it disbands
max_team_elo_gap = 200   # widest average-Elo gap allowed between the teams in one match
rematch_cooldown = 300   # seconds before the same two players can be put against each other again

[lobby]
# The DeathMatch server's Steam server code, which is what /lobby hands to Unturned.
#
# This is the steamID64 the server's GSLT owns, so it survives a restart. The FakeIP
# address printed beside it in the console does not: the server runs with PROTECTION
# set to fakeip, and the relay hands out a fresh 169.254.x.x:port every session, which
# is exactly why the code and not the address is the thing worth writing down.
#
# It only changes if the login token does. Read the new one off the server console
# ("Server Code: ...") after a GSLT change.
connect_code = "85568392936415589"

[data_files]
# Big machine-shaped datasets stay JSON; these paths are relative to this file.
mmconfig = "mmconfig.json"
kits = "kits.json"

[permissions]
# Bit order matters — a permission's index is its bit in Users.permissions.
list = ["admin", "canWriteBlog", "premium"]

[discord]
client_id = "1317158396629094451"
invite_url = "https://discord.gg/NKgTe6RnvH"

# Voice channel renamed to the live arena population, so the sidebar answers "is
# anyone playing" without anyone having to open a channel or the game.
#
# A channel id is not a secret, so it lives here rather than in the environment.
# Nothing renames it unless BOT_TOKEN is set, which is what keeps dev — which
# deliberately runs without one — from renaming the production channel.
counter_channel = "1538266851203879032"

# Seconds between renames. Discord allows two channel renames per ten minutes and
# answers the third with a 429, so this cannot usefully go below ~300.
counter_interval = 360

# How long an arena must have been empty before the first player to walk into it is
# worth announcing. People join an empty server, find nobody, and leave within seconds,
# so a short value here would post several times an hour and teach everyone to ignore it.
wake_ping_after = 1800

# Where in-game /report lands, and the role it pings. Not secrets, so they live
# here rather than in the environment, and like counter_channel nothing posts
# unless BOT_TOKEN is set, which is what keeps dev out of the real staff channel.
#
# The ping goes in the message content, never in the embed: a mention inside an
# embed renders as a mention but notifies nobody, so a report that pinged no one
# would look identical to one that worked.
report_channel = "1543350716683395199"
staff_role = "1309223753129005117"

[regions.names]
# Region id -> display name used in Discord queue pings.
paris = "EU-West"
utah = "US-West"
singapore = "AS-South"
brazil = "SA-East"