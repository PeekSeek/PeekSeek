# Non-secret configuration. Secrets (DB, tokens, keys) live in the environment.

[app]
domain = "127.0.0.1"        # public hostname, no scheme
protocol = "http"
build = "develop"

[matchmaking]
queue_timeout = 60   # seconds without a heartbeat before a player drops from queue
host_grace = 20      # seconds past selection a serverless match waits before it is cancelled
party_timeout = 600  # seconds with nobody looking at a party before it disbands
max_team_elo_gap = 200   # widest average-Elo gap allowed between the teams in one match
rematch_cooldown = 300   # seconds before the same two players can be put against each other again

[data_files]
# Big machine-shaped datasets stay JSON; these paths are relative to this file.
mmconfig = "mmconfig.json"
kits = "kits.json"

[permissions]
# Bit order matters — a permission's index is its bit in Users.permissions.
list = ["admin", "canWriteBlog", "premium"]

[discord]
client_id = "1317158396629094451"
invite_url = "https://discord.gg/NKgTe6RnvH"

# Voice channel renamed to the live arena population, so the sidebar answers "is
# anyone playing" without anyone having to open a channel or the game.
#
# A channel id is not a secret, so it lives here rather than in the environment.
# Nothing renames it unless BOT_TOKEN is set, which is what keeps dev — which
# deliberately runs without one — from renaming the production channel.
counter_channel = "1538266851203879032"

# Seconds between renames. Discord allows two channel renames per ten minutes and
# answers the third with a 429, so this cannot usefully go below ~300.
counter_interval = 360

[regions.names]
# Region id -> display name used in Discord queue pings.
paris = "EU-West"
utah = "US-West"
singapore = "AS-South"
brazil = "SA-East"